CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_DEVICE_NAME="TAG Scanner"

# The DK's own USB-UART bridge is directly accessible (unlike the TAG,
# which needs a J-Link/RTT session through the DK's debug header), so plain
# UART console logging works fine here - just open the DK's serial port in
# any terminal. Deferred mode + a bigger buffer still avoid dropping the
# boot-time burst of log lines (default is 1024 bytes, too small - see
# tag/01-motion-adv for where this was diagnosed).
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
