CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_DEVICE_NAME="TAG Scanner"

# The DK's own USB-UART bridge is directly accessible (unlike the TAG,
# which needs a J-Link/RTT session through the DK's debug header), so plain
# UART console logging works fine here - just open the DK's serial port in
# any terminal.
#
# Immediate (synchronous) mode, not deferred: the dashboard (main.c) clears
# the screen and draws the static layout right after boot. With deferred
# logging, boot-time LOG_INF calls (ours and the BT stack's) are only
# queued at the call site and flushed later by a separate logging thread -
# that flush can land AFTER our clear-screen, printing boot text on top of
# the freshly drawn dashboard. Immediate mode writes each line out fully
# before the call returns, so by the time dashboard_init() runs, all boot
# logging is guaranteed to already be on screen and done.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# The per-tag dashboard (main.c) writes raw ANSI cursor-positioning escape
# codes via printk() and needs them to reach the console immediately and
# unmodified. By default CONFIG_LOG_PRINTK=y redirects printk() through the
# logging subsystem instead (deferred, reformatted with a log prefix),
# which would garble the escape sequences - turn that off.
CONFIG_LOG_PRINTK=n
