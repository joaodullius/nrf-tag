CONFIG_LOG=y

# Motion detector (ADXL367): continuous data-ready sampling, interrupt-
# driven, decision made in software - see tag/01-motion-adv/src/main.c's
# data_ready_handler() comment for why (the chip's own ACT/INACT hardware
# engine doesn't fire reliably). Same algorithm, ported to run here instead
# of on the app core.
CONFIG_SENSOR=y
CONFIG_ADXL367_TRIGGER_GLOBAL_THREAD=y

# IPC to the cpuapp core (see ../src/main.c) to report motion state.
CONFIG_IPC_SERVICE=y
CONFIG_MBOX=y

# Route logging to SEGGER RTT - same rationale as tag/01-motion-adv (avoid
# the default synchronous mode dropping a boot-time burst of log lines).
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
