CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_LOG=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# nrfx 4.0 (NCS 3.4.x): per-driver symbols only; instances come from devicetree
CONFIG_NRFX_SPIM=y
CONFIG_NRFX_GPIOTE=y
CONFIG_NRFX_GPPI=y

# The SPI bus is driven directly with nrfx: keep the Zephyr SPI and sensor drivers away from it.
CONFIG_SPI=n
CONFIG_SENSOR=n
CONFIG_I2C=n
CONFIG_MAIN_STACK_SIZE=4096

# Log over SEGGER RTT; no UART, so the log adds no current of its own
CONFIG_SERIAL=n
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
CONFIG_LOG_MODE_IMMEDIATE=y
