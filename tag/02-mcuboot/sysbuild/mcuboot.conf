# Cosmetic only: bumps MCUboot's own RTT log verbosity so the boot banner
# is more informative during the workshop - has no effect on the actual
# DFU mechanism (that happens over BT SMP from the app, not through
# MCUboot's own serial recovery). CONFIG_MCUBOOT_INDICATION_LED was
# considered and rejected: it only lights up during MCUboot's own serial
# recovery mode, which this flow never enters (see design spec).
CONFIG_MCUBOOT_LOG_LEVEL_DBG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_UART_CONSOLE=n
