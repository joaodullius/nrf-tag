CONFIG_BT=y
CONFIG_LOG=y
CONFIG_BT_DEVICE_NAME="Test beacon"
CONFIG_BT_PERIPHERAL=y

# Connectable FOTA window: mcumgr/SMP over BLE, using MCUboot (enabled via
# sysbuild.conf's SB_CONFIG_BOOTLOADER_MCUBOOT=y) as the bootloader. Same
# Kconfig Nordic validates in CI for peripheral_lbs on this exact board
# target (sample.bluetooth.peripheral_lbs.l15_tag in
# nrf/samples/bluetooth/peripheral_lbs/sample.yaml) - enables image
# management, OS management/reboot, settings erase, BT packet
# reassembly, and an MTU/buffer speedup, all in one option.
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y

# TX power: default is 0 dBm (CONFIG_BT_CTLR_TX_PWR_0, applied automatically
# just from CONFIG_BT=y). Uncomment ONE line below to override - works with
# the SoftDevice Controller too. Valid discrete values for the nRF54L15
# range from -10 dBm to +8 dBm (see zephyr/subsys/bluetooth/controller/
# Kconfig, options gated on SOC_COMPATIBLE_NRF54LX, for the full list).
# CONFIG_BT_CTLR_TX_PWR_MINUS_10=y  # -10 dBm
# CONFIG_BT_CTLR_TX_PWR_0=y         # 0 dBm (default)
# CONFIG_BT_CTLR_TX_PWR_PLUS_4=y    # +4 dBm
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y    # +8 dBm

# Motion detector (ADXL367): continuous data-ready sampling, interrupt-
# driven (no busy-polling loop), with the motion decision made in software -
# see the comment above data_ready_handler() in main.c for why we don't use
# the chip's own hardware ACT/INACT engine.
CONFIG_SENSOR=y
CONFIG_ADXL367_TRIGGER_GLOBAL_THREAD=y

# Route logging to SEGGER RTT (over the same J-Link connection used to
# flash the TAG) instead of UART - no extra wiring needed. Deferred mode
# queues messages through the logging subsystem's own buffer/thread instead
# of writing synchronously, so a boot-time burst doesn't overflow the RTT
# transport and silently drop lines (this is the same config Nordic uses in
# CI for peripheral_lbs on this exact board target).
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG_MODE_DEFERRED=y

# Both default to 1024 bytes, too small for the burst of BT stack + our own
# boot-time log lines - messages were silently dropped (not a hang, proven
# by the independent k_timer heartbeat and the main-loop [PING] both still
# running on schedule while several of our own LOG_INF lines never showed
# up). Bump both the deferred log ring buffer and the RTT transport buffer.
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

# ── Memfault SDK: observability via nRFCloud ──────────────────────────────
# Transport: Memfault Diagnostic Service (BT_MDS, a GATT service) - the TAG
# has no modem/Wi-Fi, so chunks reach nRFCloud via the nRF Connect Device
# Manager app's Diagnostics tab acting as a BLE-to-cloud gateway (same
# pattern as nrf/samples/bluetooth/peripheral_mds and the ble_workshop
# reference project).
CONFIG_MEMFAULT=y
CONFIG_BT_MDS=y

CONFIG_MEMFAULT_NCS_PROJECT_KEY="azp4wuQBrD4ckTGPO1MxZyCpLrMPmvrn"

# Static FW version: same string ($(APP_VERSION_TWEAK_STRING), from the
# VERSION file at the app root) as the one imgtool stamps into the MCUboot
# image header for BLE DFU (CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION - defaults
# to the same value). Without this, MEMFAULT_NCS_FW_VERSION_AUTO (the
# Kconfig default) reports a DIFFERENT string on the Memfault/nRFCloud
# dashboard (APP_VERSION_STRING + a Memfault build-id suffix, not the
# MCUboot tweak field) - the two version numbers would silently drift.
CONFIG_MEMFAULT_NCS_FW_VERSION_STATIC=y

# Automatic BLE metrics (connection count/time) + our own
# motion_transition_count (memfault_config/memfault_metrics_heartbeat_config.def).
CONFIG_MEMFAULT_NCS_BT_METRICS=y
CONFIG_MEMFAULT_METRICS_BLUETOOTH=y

# Captures Zephyr log lines into crash reports.
CONFIG_MEMFAULT_LOGGING_ENABLE=y

# Coredump storage: RRAM instead of RAM, so it survives the button-reset/
# reboot that happens between the fault trigger (src/main.c, k_oops() at
# FAULT_HOLD_MS) and the next BLE connection able to upload it.
#
# NOT CONFIG_MEMFAULT_NCS_INTERNAL_FLASH_BACKED_COREDUMP - that Kconfig
# (nrf/modules/memfault-firmware-sdk/memfault_flash_coredump_storage.c)
# unconditionally #includes <nrfx_nvmc.h>, which only exists for NVMC-based
# chips (nRF52/53/91) - it fails to build on the nRF54L's RRAM controller
# (confirmed: build error on NRF_NVMC_Type/nrf_nvmc_ready_check undeclared).
# CONFIG_MEMFAULT_COREDUMP_STORAGE_NRF_RRAM is the RRAM-specific
# implementation (modules/lib/memfault-firmware-sdk/ports/zephyr/common/
# coredump_storage/memfault_nrf_rram_backed_coredump.c, depends on
# NRFX_RRAMC - already =y by default on this board via SOC_FLASH_NRF_RRAM).
# It resolves the same `memfault_coredump_partition` fixed-partition by
# label (boards/nrf54l15tag_nrf54l15_cpuapp.overlay) - no chosen node or
# CONFIG_FLASH needed, it writes directly via the RRAMC HAL (memory-mapped).
CONFIG_MEMFAULT_COREDUMP_STORAGE_NRF_RRAM=y

# Heartbeat every 5 min (default: 1h) - shortened for the workshop demo.
CONFIG_MEMFAULT_METRICS_HEARTBEAT_INTERVAL_SECS=300

# Memfault's HTTP/chunk queue plumbing needs heap; the base 01-motion-adv/
# 02-mcuboot prj.conf never set this (default is small).
CONFIG_HEAP_MEM_POOL_SIZE=4096
